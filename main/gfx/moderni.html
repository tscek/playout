<!doctype html>
<html><head><meta charset="utf-8"><title>Moderni napis</title>
<style>
:root { --bg: #0b3d91; --accent: #f5a623; --text: #ffffff; --font: 'Segoe UI', Arial, sans-serif; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; font-family: var(--font); }
.empty { display: none !important; }

#box { position: absolute; bottom: 110px; display: flex; align-items: center; gap: 28px; color: var(--text); }
#box.left { left: 140px; }
#box.center { left: 50%; transform: translateX(-50%); }
#box.right { right: 140px; flex-direction: row-reverse; text-align: right; }
#logo { display: none; }
#logo.has { display: block; }
#logo img { display: block; max-height: 130px; max-width: 260px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.5));
  opacity: 0; transform: scale(.85); transition: opacity .4s ease .1s, transform .5s cubic-bezier(.2,.8,.2,1) .1s; }
#txt { display: flex; flex-direction: column; }
#name { font-size: 66px; font-weight: 700; line-height: 1.1; white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,.6);
  opacity: 0; transform: translateY(24px); transition: opacity .4s ease .25s, transform .5s cubic-bezier(.2,.8,.2,1) .25s; }
#line { height: 6px; background: var(--accent); margin: 10px 0 12px; transform: scaleX(0); transform-origin: left; transition: transform .5s cubic-bezier(.2,.8,.2,1); box-shadow: 0 1px 6px rgba(0,0,0,.4); }
#box.right #line { transform-origin: right; }
#box.center #line { transform-origin: center; }
#box.center #txt { text-align: center; }
#sub { font-size: 38px; font-weight: 500; white-space: nowrap; text-shadow: 0 2px 8px rgba(0,0,0,.6);
  opacity: 0; transform: translateY(-14px); transition: opacity .4s ease .45s, transform .5s cubic-bezier(.2,.8,.2,1) .45s; }
#box.in #logo img, #box.in #name, #box.in #sub { opacity: 1; transform: none; }
#box.in #line { transform: scaleX(1); }
#box.out * { transition-delay: 0s !important; transition-duration: .3s !important; }

</style></head>
<body><div id="stage"><div id="box" data-def="left">
  <div id="logo"><img id="logoimg" alt=""></div>
  <div id="txt"><div id="name"><span id="f0"></span></div><div id="line"></div><div id="sub"><span id="f1"></span></div></div>
</div></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
function fit() { const k = window.innerWidth / 1920; $('stage').style.transform = 'scale(' + k + ')'; }
window.addEventListener('resize', fit); fit();
function parse(s) {
  if (s && typeof s === 'object') return s;
  try { return JSON.parse(s); } catch (e) { return {}; }
}
function applyCommon(d) {
  const r = document.documentElement.style;
  if (d.bg) r.setProperty('--bg', d.bg);
  if (d.accent) r.setProperty('--accent', d.accent);
  if (d.text) r.setProperty('--text', d.text);
  if (d.font) r.setProperty('--font', "'" + d.font + "', 'Segoe UI', Arial, sans-serif");
  for (const k of ['f0', 'f1', 'f2']) if ($(k)) $(k).textContent = d[k] || '';
  const img = $('logoimg');
  if (img) { if (d.logo) img.src = d.logo; else img.removeAttribute('src'); }
  if ($('logo')) $('logo').classList.toggle('has', !!d.logo);
  const box = $('box');
  for (const a of ['left', 'center', 'right', 'tl', 'tr', 'bl', 'br']) box.classList.toggle(a, (d.align || box.dataset.def) === a);
  for (const k of ['f0', 'f1', 'f2']) if ($(k)) $(k).parentElement.classList.toggle('empty', !d[k]);
}
function update(s) { applyCommon(parse(s)); }
function play() { const b = $('box'); b.classList.remove('out'); void b.offsetWidth; b.classList.add('in'); }
function stop() { const b = $('box'); b.classList.add('out'); b.classList.remove('in'); }
function next() {}
</script></body></html>
