<!doctype html>
<html><head><meta charset="utf-8"><title>Glavni naslov: otvoritev</title>
<style>
:root { --bg: #0b3d91; --accent: #f5a623; --text: #ffffff; --font: 'Segoe UI', Arial, sans-serif; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; font-family: var(--font); color: var(--text); overflow: hidden; }
.sw { position: absolute; top: -20%; height: 140%; width: 140%; left: -20%; transform: translateX(-120%) skewX(-18deg); }
#s1 { background: var(--accent); transition: transform .55s cubic-bezier(.7,0,.2,1); }
#s2 { background: color-mix(in srgb, var(--bg) 70%, #fff); transition: transform .55s cubic-bezier(.7,0,.2,1) .08s; }
#s3 { background: var(--bg); transition: transform .6s cubic-bezier(.7,0,.2,1) .16s; }
#deco { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease .6s;
  background: repeating-linear-gradient(-18deg, transparent 0 120px, color-mix(in srgb, #fff 4%, transparent) 120px 240px); }
#box { position: absolute; left: 160px; right: 160px; top: 50%; transform: translateY(-50%); }
#t2 { display: inline-block; font-size: 30px; font-weight: 800; letter-spacing: .2em; background: var(--accent); color: var(--bg); padding: 8px 20px;
  text-transform: uppercase; clip-path: inset(0 100% 0 0); transition: clip-path .5s cubic-bezier(.2,.9,.2,1) .75s; margin-bottom: 26px; }
#t2.empty { display: none; }
.mask { overflow: hidden; padding-bottom: 6px; }
#t0 { font-size: 112px; font-weight: 900; line-height: 1.04; transform: translateY(110%); transition: transform .8s cubic-bezier(.2,.9,.2,1) .6s; }
#t1 { font-size: 48px; font-weight: 400; line-height: 1.25; margin-top: 18px; opacity: .92; transform: translateY(110%); transition: transform .8s cubic-bezier(.2,.9,.2,1) .78s; }
#t1w.empty { display: none; }
#stage.in .sw { transform: translateX(0) skewX(-18deg); }
#stage.in #deco { opacity: 1; }
#stage.in #t2 { clip-path: inset(0 0 0 0); }
#stage.in #t0, #stage.in #t1 { transform: none; }
#stage.out #box { opacity: 0; transition: opacity .25s ease; }
#stage.out #deco { opacity: 0; transition: opacity .25s; }
#stage.out .sw { transform: translateX(120%) skewX(-18deg); }
#stage.out #s3 { transition: transform .55s cubic-bezier(.7,0,.2,1) .1s; }
#stage.out #s2 { transition: transform .55s cubic-bezier(.7,0,.2,1) .18s; }
#stage.out #s1 { transition: transform .55s cubic-bezier(.7,0,.2,1) .26s; }
</style></head>
<body><div id="stage">
  <div class="sw" id="s1"></div><div class="sw" id="s2"></div><div class="sw" id="s3"></div><div id="deco"></div>
  <div id="box"><div id="t2"><span id="f2"></span></div><div class="mask"><div id="t0"><span id="f0"></span></div></div>
    <div class="mask" id="t1w"><div id="t1"><span id="f1"></span></div></div></div>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
function fit() { $('stage').style.transform = 'scale(' + window.innerWidth / 1920 + ')'; }
window.addEventListener('resize', fit); fit();
function parse(s) { if (s && typeof s === 'object') return s; try { return JSON.parse(s); } catch (e) { return {}; } }
function update(s) {
  const d = parse(s);
  const r = document.documentElement.style;
  if (d.bg) r.setProperty('--bg', d.bg);
  if (d.accent) r.setProperty('--accent', d.accent);
  if (d.text) r.setProperty('--text', d.text);
  if (d.font) r.setProperty('--font', "'" + d.font + "', 'Segoe UI', Arial, sans-serif");
  for (const k of ['f0', 'f1', 'f2']) $(k).textContent = d[k] || '';
  $('t1w').classList.toggle('empty', !d.f1);
  $('t2').classList.toggle('empty', !d.f2);
}
function play() { const st = $('stage'); st.classList.remove('out'); void st.offsetWidth; st.classList.add('in'); }
function stop() { const st = $('stage'); st.classList.add('out'); st.classList.remove('in'); }
function next() {}
</script></body></html>
