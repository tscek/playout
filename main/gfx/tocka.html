<!doctype html>
<html><head><meta charset="utf-8"><title>Na vrsti (program prireditve)</title>
<style>
:root { --bg: #0b3d91; --accent: #f5a623; --text: #ffffff; --font: 'Segoe UI', Arial, sans-serif; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; font-family: var(--font); color: var(--text); }
#card { position: absolute; display: flex; flex-direction: column; min-width: 420px; max-width: 900px; background: var(--bg); border-radius: 14px; overflow: hidden;
  box-shadow: 0 16px 40px rgba(0,0,0,.4); opacity: 0; transition: opacity .3s ease, transform .55s cubic-bezier(.2,1.2,.3,1); }
#card.tl { left: 90px; top: 70px; transform: translateY(-140%); }
#card.tr { right: 90px; top: 70px; transform: translateY(-140%); }
#card.bl { left: 90px; bottom: 90px; transform: translateY(140%); }
#card.br { right: 90px; bottom: 90px; transform: translateY(140%); }
#t2 { background: var(--accent); color: var(--bg); font-size: 26px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; padding: 8px 26px; }
#t2.empty { display: none; }
#body { padding: 16px 26px 18px; }
#t0 { font-size: 50px; font-weight: 800; line-height: 1.1; opacity: 0; transform: translateX(-30px); transition: all .45s ease .35s; }
#t1 { font-size: 32px; line-height: 1.25; margin-top: 6px; opacity: 0; transform: translateX(-30px); transition: all .45s ease .48s; color: color-mix(in srgb, var(--text) 80%, transparent); }
#t1.empty { display: none; }
#card.in { opacity: 1; transform: none; }
#card.in #t0, #card.in #t1 { opacity: 1; transform: none; }
#card.out { opacity: 0; transition: opacity .4s ease, transform .4s ease; }
#card.out * { transition-delay: 0s !important; }
</style></head>
<body><div id="stage"><div id="card" class="tr">
  <div id="t2"><span id="f2"></span></div>
  <div id="body"><div id="t0"><span id="f0"></span></div><div id="t1"><span id="f1"></span></div></div>
</div></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
function fit() { $('stage').style.transform = 'scale(' + window.innerWidth / 1920 + ')'; }
window.addEventListener('resize', fit); fit();
function parse(s) { if (s && typeof s === 'object') return s; try { return JSON.parse(s); } catch (e) { return {}; } }
function update(s) {
  const d = parse(s);
  const r = document.documentElement.style;
  if (d.bg) r.setProperty('--bg', d.bg);
  if (d.accent) r.setProperty('--accent', d.accent);
  if (d.text) r.setProperty('--text', d.text);
  if (d.font) r.setProperty('--font', "'" + d.font + "', 'Segoe UI', Arial, sans-serif");
  for (const k of ['f0', 'f1', 'f2']) $(k).textContent = d[k] || '';
  $('t1').classList.toggle('empty', !d.f1);
  $('t2').classList.toggle('empty', !d.f2);
  const c = $('card');
  for (const a of ['tl', 'tr', 'bl', 'br']) c.classList.toggle(a, (d.align || 'tr') === a);
}
function play() { const c = $('card'); c.classList.remove('out'); void c.offsetWidth; c.classList.add('in'); }
function stop() { const c = $('card'); c.classList.add('out'); c.classList.remove('in'); }
function next() {}
</script></body></html>
