name: Gradnja

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Preizkus branja zaslonov (PowerShell)
        run: node -e "require('./main/engine/displays').listDisplays().then(l => { console.log(JSON.stringify(l, null, 1)); if (!l.length) process.exit(1); }).catch(e => { console.error(e); process.exit(1); })"

      - name: Pripravi motor CasparCG
        run: node scripts/fetch-casparcg.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zgradi namestitveni program
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Naloži namestitveni program
        uses: actions/upload-artifact@v4
        with:
          name: Playout-Setup
          path: dist/*.exe
          retention-days: 30

      - name: Objavi testno izdajo (vsaka gradnja glavne veje)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"; fi
          gh release create "${TAG}" dist/*.exe \
            --target "${GITHUB_SHA}" \
            --title "Playout ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
